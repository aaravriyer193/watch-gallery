<style>

body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--fg);overflow:hidden;height:100vh}

.tbtn{padding:12px 16px;font-size:13px;font-weight:500;color:var(--fgd);border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;transition:all .2s;letter-spacing:.05em;font-family:inherit}
.tbtn:hover{color:var(--fgm)}.tbtn.act{color:var(--acc);border-bottom-color:var(--acc)}
.ogl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--fgd);margin-bottom:8px;font-weight:500}
.csw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s;flex-shrink:0}
.csw:hover{transform:scale(1.12)}.csw.act{border-color:var(--acc);box-shadow:0 0 0 2px var(--bg2),0 0 0 4px var(--acc)}

.sbtn:hover{border-color:var(--bdr2);color:var(--fg)}.sbtn.act{border-color:var(--acc);color:var(--acc);background:rgba(201,169,110,.08)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.price-num{font-variant-numeric:tabular-nums}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ===== Configuration State ===== */
const cfg = {
    dial: { color: '#0a0a0a', index: 'applied', hand: 'dauphine' },
    cas:  { mat: 'steel', size: 40, water: 100 },
    strap:{ type: 'leather', color: '#3d1f0e' },
    acc:  { gems: false, lume: false }
};

const prices = {
    base: 2500,
    dialCol: { '#0a0a0a':0, '#1a2a4a':200, '#f0ece4':0, '#1a3a2a':300, '#d4c5a0':400 },
    idx: { applied:0, roman:150, dot:0, stick:0 },
    hand: { dauphine:0, baton:0, leaf:200 },
    mat: { steel:0, gold:3000, black:500 },
    size: { 38:0, 40:0, 42:0, 44:100 },
    water: { 50:0, 100:200, 300:500 },
    strapType: { leather:0, metal:400, silicone:0 },
    gems: 2500, lume: 100
};

function calcPrice() {
    let p = prices.base;
    p += prices.dialCol[cfg.dial.color] || 0;
    p += prices.idx[cfg.dial.index] || 0;
    p += prices.hand[cfg.dial.hand] || 0;
    p += prices.mat[cfg.cas.mat] || 0;
    p += prices.size[cfg.cas.size] || 0;
    p += prices.water[cfg.cas.water] || 0;
    p += prices.strapType[cfg.strap.type] || 0;
    if (cfg.acc.gems) p += prices.gems;
    if (cfg.acc.lume) p += prices.lume;
    return p;
}
function fmtPrice(n) { return '$' + n.toLocaleString('en-US'); }

/* ===== Three.js Setup ===== */
const canvas = document.getElementById('watchCanvas');
const viewer = document.getElementById('viewer');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(0, 0.8, 5.5);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.minDistance = 2.5;
controls.maxDistance = 9;
controls.enablePan = false;

let autoRotateTimer = null;
controls.addEventListener('start', () => {
    controls.autoRotate = false;
    clearTimeout(autoRotateTimer);
    const h = document.getElementById('dragHint');
    if (h) h.style.opacity = '0';
});
controls.addEventListener('end', () => {
    autoRotateTimer = setTimeout(() => { controls.autoRotate = true; }, 4000);
});

/* ===== Lighting ===== */
scene.add(new THREE.AmbientLight(0x333333, 0.4));
const keyLight = new THREE.DirectionalLight(0xfff0dd, 2.2);
keyLight.position.set(4, 6, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xc8d8f0, 0.5);
fillLight.position.set(-4, 2, 4);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xffffff, 0.9);
rimLight.position.set(0, 3, -6);
scene.add(rimLight);
const bottomFill = new THREE.PointLight(0xc9a96e, 0.4, 12);
bottomFill.position.set(0, -4, 2);
scene.add(bottomFill);

/* ===== Environment Map ===== */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x111111);
const lp1 = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
lp1.position.set(0, 9, 0); lp1.rotation.x = Math.PI / 2; envScene.add(lp1);
const lp2 = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshBasicMaterial({ color: 0xfff5e0, side: THREE.DoubleSide }));
lp2.position.set(6, 3, 5); lp2.lookAt(0, 0, 0); envScene.add(lp2);
const lp3 = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshBasicMaterial({ color: 0xe0e8ff, side: THREE.DoubleSide }));
lp3.position.set(-5, 2, 4); lp3.lookAt(0, 0, 0); envScene.add(lp3);
scene.environment = pmrem.fromScene(envScene, 0, 0.1, 100).texture;
pmrem.dispose();

/* ===== Ground ===== */
const ground = new THREE.Mesh(
    new THREE.CircleGeometry(6, 64),
    new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.25, metalness: 0.7 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2.4;
ground.receiveShadow = true;
scene.add(ground);

/* ===== Background Particles ===== */
const particleCount = 80;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
    pPos[i * 3] = (Math.random() - 0.5) * 16;
    pPos[i * 3 + 1] = (Math.random() - 0.5) * 10;
    pPos[i * 3 + 2] = (Math.random() - 0.5) * 16 - 3;
}
pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
scene.add(new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0xc9a96e, size: 0.015, transparent: true, opacity: 0.3 })));

/* ===== Watch Group ===== */
const watchGroup = new THREE.Group();
watchGroup.rotation.x = -0.25;
watchGroup.rotation.y = 0.3;
scene.add(watchGroup);

/* ===== Material Factories ===== */
function caseMat() {
    const defs = {
        steel: { color: 0xc0c0c8, metalness: 0.95, roughness: 0.06 },
        gold:  { color: 0xc9a96e, metalness: 0.95, roughness: 0.1 },
        black: { color: 0x1c1c1c, metalness: 0.82, roughness: 0.18 }
    };
    const d = defs[cfg.cas.mat] || defs.steel;
    return new THREE.MeshStandardMaterial(d);
}
function handMat() {
    if (cfg.acc.lume) return new THREE.MeshStandardMaterial({ color: 0xe8e4de, metalness: 0.7, roughness: 0.2, emissive: 0x44cc66, emissiveIntensity: 0.3 });
    const c = cfg.dial.color === '#f0ece4' ? 0x1a1a1a : 0xe8e4de;
    return new THREE.MeshStandardMaterial({ color: c, metalness: 0.8, roughness: 0.15 });
}
function secHandMat() {
    if (cfg.acc.lume) return new THREE.MeshStandardMaterial({ color: 0x44cc66, metalness: 0.3, roughness: 0.3, emissive: 0x44cc66, emissiveIntensity: 0.5 });
    return new THREE.MeshStandardMaterial({ color: 0xcc3333, metalness: 0.5, roughness: 0.3 });
}
function gemMat() {
    return new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0, transmission: 0.6, thickness: 0.5, ior: 2.4, emissive: 0x8888ff, emissiveIntensity: 0.15 });
}

/* ===== Dial Texture ===== */
function makeDialTexture() {
    const sz = 1024, c = document.createElement('canvas');
    c.width = sz; c.height = sz;
    const x = c.getContext('2d'), cx = sz / 2, cy = sz / 2, r = sz * 0.46;
    const isDark = cfg.dial.color !== '#f0ece4';
    const fg = isDark ? '#cccccc' : '#2a2a2a';
    const fgd = isDark ? '#666666' : '#888888';

    x.fillStyle = cfg.dial.color;
    x.beginPath(); x.arc(cx, cy, r + 20, 0, Math.PI * 2); x.fill();

    x.save(); x.globalAlpha = 0.025;
    for (let i = 0; i < 360; i++) {
        const a = (i * Math.PI) / 180;
        x.beginPath(); x.moveTo(cx, cy);
        x.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
        x.strokeStyle = '#ffffff'; x.lineWidth = 0.8; x.stroke();
    }
    x.restore();

    const rg = x.createRadialGradient(cx, cy - r * 0.2, 0, cx, cy, r);
    rg.addColorStop(0, 'rgba(255,255,255,0.04)');
    rg.addColorStop(1, 'rgba(0,0,0,0.06)');
    x.fillStyle = rg;
    x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();

    for (let i = 0; i < 60; i++) {
        const a = (i * Math.PI * 2) / 60 - Math.PI / 2;
        const isH = i % 5 === 0;
        const ir = isH ? r * 0.8 : r * 0.87;
        const or = r * 0.91;
        x.strokeStyle = fgd; x.lineWidth = isH ? 2.5 : 0.8;
        x.beginPath();
        x.moveTo(cx + Math.cos(a) * ir, cy + Math.sin(a) * ir);
        x.lineTo(cx + Math.cos(a) * or, cy + Math.sin(a) * or);
        x.stroke();
    }

    x.fillStyle = fg; x.strokeStyle = fg;
    for (let i = 0; i < 12; i++) {
        const a = (i * Math.PI * 2) / 12 - Math.PI / 2;
        const px = cx + Math.cos(a) * r * 0.7;
        const py = cy + Math.sin(a) * r * 0.7;
        if (cfg.dial.index === 'applied') {
            x.save(); x.translate(px, py); x.rotate(a + Math.PI / 2);
            const w = (i % 3 === 0) ? 10 : 6, h = (i % 3 === 0) ? 36 : 28;
            x.fillStyle = fg;
            x.shadowColor = 'rgba(0,0,0,0.4)'; x.shadowBlur = 4; x.shadowOffsetY = 2;
            x.fillRect(-w / 2, -h / 2, w, h);
            x.shadowBlur = 0; x.shadowOffsetY = 0;
            x.fillStyle = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.3)';
            x.fillRect(-w / 2, -h / 2, w, 2);
            x.restore();
        } else if (cfg.dial.index === 'roman') {
            const romans = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
            x.save(); x.translate(px, py); x.rotate(a + Math.PI / 2);
            x.font = `500 ${(i % 3 === 0) ? 30 : 22}px Georgia, serif`;
            x.textAlign = 'center'; x.textBaseline = 'middle';
            x.fillStyle = fg; x.fillText(romans[i], 0, 0);
            x.restore();
        } else if (cfg.dial.index === 'dot') {
            x.beginPath();
            x.arc(px, py, Math.max(1, (i % 3 === 0) ? 8 : 5), 0, Math.PI * 2);
            x.fillStyle = fg; x.fill();
        } else if (cfg.dial.index === 'stick') {
            x.save(); x.translate(px, py); x.rotate(a + Math.PI / 2);
            x.strokeStyle = fg; x.lineWidth = (i % 3 === 0) ? 2.5 : 1.2; x.lineCap = 'round';
            const h = (i % 3 === 0) ? 32 : 22;
            x.beginPath(); x.moveTo(0, -h / 2); x.lineTo(0, h / 2); x.stroke();
            x.restore();
        }
    }

    if (cfg.acc.lume) {
        for (let i = 0; i < 12; i++) {
            if (i % 3 !== 0) continue;
            const a = (i * Math.PI * 2) / 12 - Math.PI / 2;
            const lx = cx + Math.cos(a) * r * 0.78;
            const ly = cy + Math.sin(a) * r * 0.78;
            x.beginPath(); x.arc(lx, ly, 4, 0, Math.PI * 2);
            x.fillStyle = '#44cc66'; x.shadowColor = '#44cc66'; x.shadowBlur = 8;
            x.fill(); x.shadowBlur = 0;
        }
    }

    x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '600 32px Georgia, serif';
    x.fillText('CHRONOS', cx, cy - r * 0.38);
    x.font = '300 14px "Space Grotesk", sans-serif';
    x.fillText('AUTOMATIC', cx, cy - r * 0.28);
    x.font = '400 11px "Space Grotesk", sans-serif';
    x.fillStyle = fgd;
    x.fillText('SWISS MADE', cx, cy + r * 0.42);

    const dx = cx + r * 0.55, dy = cy;
    x.fillStyle = '#ffffff'; x.fillRect(dx - 14, dy - 10, 28, 20);
    x.strokeStyle = '#aaaaaa'; x.lineWidth = 1; x.strokeRect(dx - 14, dy - 10, 28, 20);
    x.fillStyle = '#000000'; x.font = '600 13px "Space Grotesk", sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(String(new Date().getDate()), dx, dy);

    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}

/* ===== Hand Geometry ===== */
function handGeo(style, len) {
    len = Math.max(0.01, len);
    const tail = len * 0.15;
    let shape;
    if (style === 'dauphine') {
        const w = len * 0.05;
        shape = new THREE.Shape();
        shape.moveTo(0, -tail); shape.lineTo(w * 0.4, -tail * 0.3);
        shape.lineTo(w, len * 0.35); shape.lineTo(0, len);
        shape.lineTo(-w, len * 0.35); shape.lineTo(-w * 0.4, -tail * 0.3);
        shape.closePath();
    } else if (style === 'baton') {
        const w = len * 0.035;
        shape = new THREE.Shape();
        shape.moveTo(-w, -tail); shape.lineTo(w, -tail);
        shape.lineTo(w, len * 0.92);
        shape.quadraticCurveTo(w, len, 0, len);
        shape.quadraticCurveTo(-w, len, -w, len * 0.92);
        shape.closePath();
    } else {
        shape = new THREE.Shape();
        shape.moveTo(0, -tail);
        shape.quadraticCurveTo(len * 0.065, len * 0.15, 0, len);
        shape.quadraticCurveTo(-len * 0.065, len * 0.15, 0, -tail);
    }
    return new THREE.ExtrudeGeometry(shape, { depth: 0.012, bevelEnabled: true, bevelThickness: 0.002, bevelSize: 0.002, bevelSegments: 2 });
}

function secHandGeo(len) {
    len = Math.max(0.01, len);
    const tail = len * 0.25, w = len * 0.012;
    const shape = new THREE.Shape();
    shape.moveTo(-w, -tail); shape.lineTo(w, -tail);
    shape.lineTo(w * 0.6, len); shape.lineTo(0, len * 1.02);
    shape.lineTo(-w * 0.6, len); shape.closePath();
    return new THREE.ExtrudeGeometry(shape, { depth: 0.006, bevelEnabled: false });
}

/* ===== Strap Geometry — built in XZ plane, length along Z, curve in Y ===== */
function strapGeo(w, l, curve, segs) {
    w = Math.max(0.01, w); l = Math.max(0.01, l); curve = Math.max(0, curve); segs = Math.max(4, segs);
    const pos = [], uvs = [], idx = [];
    for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const z = t * l;                         // extends from z=0 (case end) to z=l (far end)
        const y = -curve * Math.pow(t, 1.6);     // flat at case, curves down toward far end
        const tw = w * (1 - t * 0.06);           // subtle taper toward tip
        pos.push(-tw / 2, y, z,  tw / 2, y, z);
        uvs.push(0, t, 1, t);
    }
    for (let i = 0; i < segs; i++) {
        const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
        idx.push(a, c, b, b, c, d);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
}

function strapTexture() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 2048;
    const x = c.getContext('2d');
    x.fillStyle = cfg.strap.color;
    x.fillRect(0, 0, 512, 2048);
    if (cfg.strap.type === 'leather') {
        for (let i = 0; i < 6000; i++) {
            x.fillStyle = `rgba(${Math.random() > 0.5 ? 255 : 0},${Math.random() > 0.5 ? 255 : 0},${Math.random() > 0.5 ? 255 : 0},${Math.random() * 0.04})`;
            x.fillRect(Math.random() * 512, Math.random() * 2048, Math.random() * 3 + 1, 1);
        }
        x.strokeStyle = 'rgba(255,255,255,0.12)'; x.lineWidth = 1; x.setLineDash([5, 4]);
        x.beginPath(); x.moveTo(25, 0); x.lineTo(25, 2048); x.stroke();
        x.beginPath(); x.moveTo(487, 0); x.lineTo(487, 2048); x.stroke();
        x.setLineDash([]);
    } else if (cfg.strap.type === 'metal') {
        const lh = 2048 / 28;
        for (let i = 0; i < 28; i++) {
            const y = i * lh;
            const bright = i % 2 === 0 ? 0 : 15;
            x.fillStyle = adjustCol(cfg.strap.color, bright);
            x.fillRect(130, y + 1.5, 252, lh - 3);
            x.fillStyle = adjustCol(cfg.strap.color, -bright);
            x.fillRect(8, y + 4, 115, lh - 8);
            x.fillRect(389, y + 4, 115, lh - 8);
            x.strokeStyle = 'rgba(0,0,0,0.25)'; x.lineWidth = 1;
            x.beginPath(); x.moveTo(0, y); x.lineTo(512, y); x.stroke();
        }
        const hg = x.createLinearGradient(0, 0, 512, 0);
        hg.addColorStop(0, 'rgba(255,255,255,0)');
        hg.addColorStop(0.35, 'rgba(255,255,255,0.12)');
        hg.addColorStop(0.5, 'rgba(255,255,255,0.18)');
        hg.addColorStop(0.65, 'rgba(255,255,255,0.12)');
        hg.addColorStop(1, 'rgba(255,255,255,0)');
        x.fillStyle = hg; x.fillRect(0, 0, 512, 2048);
    } else {
        const sg = x.createLinearGradient(0, 0, 512, 0);
        sg.addColorStop(0, 'rgba(0,0,0,0.08)');
        sg.addColorStop(0.5, 'rgba(255,255,255,0.08)');
        sg.addColorStop(1, 'rgba(0,0,0,0.08)');
        x.fillStyle = sg; x.fillRect(0, 0, 512, 2048);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}

function adjustCol(hex, amt) {
    let r = parseInt(hex.slice(1, 3), 16) + amt;
    let g = parseInt(hex.slice(3, 5), 16) + amt;
    let b = parseInt(hex.slice(5, 7), 16) + amt;
    r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

/* ===== Build Watch ===== */
const parts = {};
let gemsGroup = null;

function disposeGroup(g) {
    if (!g) return;
    g.traverse(ch => {
        if (ch.geometry) ch.geometry.dispose();
        if (ch.material) {
            if (Array.isArray(ch.material)) ch.material.forEach(m => m.dispose());
            else ch.material.dispose();
        }
    });
    if (g.parent) g.parent.remove(g);
}

function buildWatch() {
    while (watchGroup.children.length) {
        disposeGroup(watchGroup.children[0]);
    }
    gemsGroup = null;

    const sc = cfg.cas.size / 40;
    const cm = caseMat();
    const R = 1.0;

    /* ---- Case Body ---- */
    const caseBody = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 0.28, 64), cm);
    caseBody.castShadow = true;
    watchGroup.add(caseBody);

    /* ---- Bezel ---- */
    const bezel = new THREE.Mesh(new THREE.TorusGeometry(R, 0.07, 16, 64), cm);
    bezel.rotation.x = Math.PI / 2;
    bezel.position.y = 0.14;
    watchGroup.add(bezel);

    /* ---- Case Back ---- */
    const caseBack = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 0.02, 64), cm);
    caseBack.position.y = -0.15;
    watchGroup.add(caseBack);

    /* ---- Crown ---- */
    const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.18, 16), cm);
    crown.rotation.z = Math.PI / 2;
    crown.position.set(R + 0.09, 0, 0);
    watchGroup.add(crown);
    const crownRing = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.015, 8, 16), cm);
    crownRing.position.set(R + 0.18, 0, 0);
    crownRing.rotation.y = Math.PI / 2;
    watchGroup.add(crownRing);

    /* ---- Lugs ---- */
    const lugSpacing = 0.72;
    const lugW = 0.13, lugH = 0.2, lugL = 0.38;
    const lugAngle = 0.1;
    const lugY = -0.02;

    const lugDefs = [
        { x: -lugSpacing / 2, z:  R + lugL / 2, ry: -lugAngle },
        { x:  lugSpacing / 2, z:  R + lugL / 2, ry:  lugAngle },
        { x: -lugSpacing / 2, z: -(R + lugL / 2), ry:  lugAngle },
        { x:  lugSpacing / 2, z: -(R + lugL / 2), ry: -lugAngle },
    ];
    const holeMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.95 });

    lugDefs.forEach(d => {
        const lug = new THREE.Mesh(new THREE.BoxGeometry(lugW, lugH, lugL), cm);
        lug.position.set(d.x, lugY, d.z);
        lug.rotation.y = d.ry;
        lug.castShadow = true;
        watchGroup.add(lug);

        // Spring bar hole at the outer end of each lug
        const hole = new THREE.Mesh(
            new THREE.CylinderGeometry(0.022, 0.022, lugW + 0.01, 8),
            holeMat
        );
        hole.rotation.z = Math.PI / 2;
        const holeDir = d.z > 0 ? 1 : -1;
        hole.position.set(d.x, lugY, d.z + holeDir * lugL * 0.38);
        watchGroup.add(hole);
    });

    /* ---- Crystal ---- */
    const crystalMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff, transparent: true, opacity: 0.12,
        roughness: 0, metalness: 0, transmission: 0.95,
        thickness: 0.3, clearcoat: 1, clearcoatRoughness: 0, ior: 1.52
    });
    const crystal = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.93, R * 0.93, 0.06, 64), crystalMat);
    crystal.position.y = 0.17;
    watchGroup.add(crystal);

    /* ---- Dial ---- */
    const dialTex = makeDialTexture();
    const dial = new THREE.Mesh(
        new THREE.CircleGeometry(R * 0.92, 64),
        new THREE.MeshStandardMaterial({ map: dialTex, roughness: 0.6, metalness: 0.1 })
    );
    dial.rotation.x = -Math.PI / 2;
    dial.position.y = 0.15;
    watchGroup.add(dial);

    /* ---- Hands ---- */
    const hm = handMat(), sm = secHandMat();

    const hourHand = new THREE.Mesh(handGeo(cfg.dial.hand, 0.52), hm);
    hourHand.position.y = 0.18; hourHand.rotation.x = -Math.PI / 2;
    hourHand.castShadow = true;
    watchGroup.add(hourHand); parts.hourHand = hourHand;

    const minuteHand = new THREE.Mesh(handGeo(cfg.dial.hand, 0.72), hm);
    minuteHand.position.y = 0.2; minuteHand.rotation.x = -Math.PI / 2;
    minuteHand.castShadow = true;
    watchGroup.add(minuteHand); parts.minuteHand = minuteHand;

    const secondHand = new THREE.Mesh(secHandGeo(0.78), sm);
    secondHand.position.y = 0.22; secondHand.rotation.x = -Math.PI / 2;
    watchGroup.add(secondHand); parts.secondHand = secondHand;

    const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.1, 16), cm);
    pin.position.y = 0.24;
    watchGroup.add(pin);

    /* ---- Gemstones ---- */
    if (cfg.acc.gems) {
        gemsGroup = new THREE.Group();
        const gm = gemMat();
        for (let i = 0; i < 12; i++) {
            const a = (i * Math.PI * 2) / 12 - Math.PI / 2;
            const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.04, 2), gm);
            gem.position.set(Math.cos(a) * R * 0.7, 0.16, Math.sin(a) * R * 0.7);
            gem.rotation.y = a;
            gemsGroup.add(gem);
        }
        watchGroup.add(gemsGroup);
    }

    /* ---- Straps ---- */
    const strapW = lugSpacing - lugW + 0.02;   // 0.61 — fits between lug inner faces
    const strapL = 3.2;
    const strapCurve = 0.55;

    const stOpts = {
        map: strapTexture(),
        roughness: cfg.strap.type === 'metal' ? 0.15 : 0.7,
        metalness: cfg.strap.type === 'metal' ? 0.85 : 0.05,
        side: THREE.DoubleSide
    };

    // Top strap — extends from case edge at z=R toward +Z
    const topStrap = new THREE.Mesh(strapGeo(strapW, strapL, strapCurve, 32), new THREE.MeshStandardMaterial(stOpts));
    topStrap.position.set(0, lugY, R);
    topStrap.castShadow = true;
    watchGroup.add(topStrap);

    // Bottom strap — extends from case edge at z=-R toward -Z
    const botStrap = new THREE.Mesh(strapGeo(strapW, strapL, strapCurve, 32), new THREE.MeshStandardMaterial({ ...stOpts, map: strapTexture() }));
    botStrap.position.set(0, lugY, -R);
    botStrap.rotation.y = Math.PI;       // mirror so it extends in -Z
    botStrap.castShadow = true;
    watchGroup.add(botStrap);

    // Keeper loops — positioned on each strap at ~60% along length
    const keeperGeo = new THREE.TorusGeometry(strapW * 0.52, 0.018, 8, 24);
    const keeperMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(cfg.strap.color).multiplyScalar(0.9), roughness: 0.6, metalness: 0.1 });

    [1, -1].forEach(dir => {
        const keeperT = 0.6;
        const keeperZ = dir * (R + strapL * keeperT);
        const keeperY = lugY - strapCurve * Math.pow(keeperT, 1.6);
        const keeper = new THREE.Mesh(keeperGeo, keeperMat);
        keeper.position.set(0, keeperY + 0.01, keeperZ);
        keeper.rotation.x = Math.PI / 2;
        watchGroup.add(keeper);
    });

    // Scale entire watch group
    watchGroup.scale.set(sc, sc, sc);
}

/* ===== Clock ===== */
function updateClock() {
    const now = new Date();
    const h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds(), ms = now.getMilliseconds();
    const ss = s + ms / 1000, sm = m + ss / 60, sh = h + sm / 60;
    if (parts.secondHand) parts.secondHand.rotation.z = -(ss / 60) * Math.PI * 2;
    if (parts.minuteHand) parts.minuteHand.rotation.z = -(sm / 60) * Math.PI * 2;
    if (parts.hourHand)   parts.hourHand.rotation.z   = -(sh / 12) * Math.PI * 2;
    const td = document.getElementById('timeDisplay');
    if (td) td.textContent = `${String(now.getHours()).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

/* ===== Camera Animations ===== */
let camAnim = null;
function animateCamera(tp, tl, dur = 1200) {
    const sp = camera.position.clone(), st = controls.target.clone();
    const start = performance.now();
    function step(t) {
        const p = Math.min(1, (t - start) / dur);
        const e = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
        camera.position.lerpVectors(sp, tp, e);
        controls.target.lerpVectors(st, tl, e);
        controls.update();
        if (p < 1) camAnim = requestAnimationFrame(step); else camAnim = null;
    }
    if (camAnim) cancelAnimationFrame(camAnim);
    camAnim = requestAnimationFrame(step);
}
document.getElementById('btnMacro').addEventListener('click', () => {

    animateCamera(new THREE.Vector3(0, 0.3, 2.2 * cfg.cas.size / 40), new THREE.Vector3(0, 0, 0));
});

    setTimeout(() => { controls.autoRotate = true; }, 1500);
});

function updatePrice() {
    const el = document.getElementById('priceDisplay');
    const target = calcPrice();
    const current = parseInt(el.textContent.replace(/[^0-9]/g, '')) || 0;
    let step = 0; const steps = 20;
    function tick() {
        step++;
        const t = step / steps, ease = 1 - Math.pow(1 - t, 3);
        el.textContent = fmtPrice(Math.round(current + (target - current) * ease));
        if (step < steps) requestAnimationFrame(tick);
    }
    tick();
}

/* ===== Resize ===== */
function onResize() {
    const w = viewer.clientWidth, h = viewer.clientHeight;
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
}

/* ===== Animation Loop ===== */
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    updateClock();
    const t = performance.now() * 0.001;
    const sc = cfg.cas.size / 40;
    const b = 1 + Math.sin(t * 0.6) * 0.003;
    watchGroup.scale.set(sc * b, sc * b, sc * b);
    if (gemsGroup) gemsGroup.children.forEach((g, i) => { g.rotation.y = t * 0.5 + i * 0.5; g.rotation.x = Math.sin(t + i) * 0.2; });
    const pp = pGeo.attributes.position.array;
    for (let i = 0; i < particleCount; i++) { pp[i*3+1] += Math.sin(t*0.3+i)*0.0003; pp[i*3] += Math.cos(t*0.2+i*0.7)*0.0002; }
    pGeo.attributes.position.needsUpdate = true;
    renderer.render(scene, camera);
}

/* ===== Init ===== */
document.fonts.ready.then(() => { onResize(); buildWatch(); renderTab('dial'); updatePrice(); animate(); });
</script>
